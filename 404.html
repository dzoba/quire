<!doctype html>
<!-- GitHub Pages serves this file at any missing path, at any depth, so every URL here is absolute (/...)
     and the styles are inline. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found – Quire</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<style>
:root{color-scheme:light dark;--paper:#faf7f0;--sheet:#fff;--ink:#1d2c3c;--muted:#58646f;--line:#e2dccd;--accent:#c4502f;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--paper:#11181f;--sheet:#18222c;--ink:#ece6d9;--muted:#a5adb5;--line:#2b3843;--accent:#ec7a57;--accent-ink:#1a0e09}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
main{max-width:520px;text-align:center}
img{width:72px;height:72px;margin:0 auto 22px;display:block}
h1{font:600 clamp(34px,7vw,48px)/1.1 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;margin:0 0 14px}
p{color:var(--muted);margin:0 0 26px}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a{color:inherit}
.btn{display:inline-flex;align-items:center;min-height:46px;padding:0 20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:650;text-decoration:none}
.alt{display:inline-flex;align-items:center;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <img src="/img/quire-mark.svg" alt="Quire logo" width="72" height="72">
  <h1>Page not found</h1>
  <p>There is no page at this address. It may have moved, or the link may have a typo.</p>
  <div class="links">
    <a class="btn" href="/">Go to the Quire homepage</a>
    <a class="alt" href="/guides/">Guides</a>
    <a class="alt" href="/privacy.html">Privacy</a>
  </div>
</main>
</body>
</html>
